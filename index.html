<!DOCTYPE html>  <html lang=zh-CN>  <meta charset=UTF-8>  <meta name=viewport content=width=device-width,initial-scale=1.0>  <title>EdgeOne KV 数据管理</title>  <style>    * { margin: 0; padding: 0; box-sizing: border-box; }    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }    .login-box, .panel { background: #1e293b; border-radius: 12px; padding: 32px; max-width: 480px; margin: 80px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }    .panel { max-width: 900px; margin: 20px auto; }    h1, h2 { color: #60a5fa; margin-bottom: 20px; }    .form-group { margin-bottom: 16px; }    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }    input, textarea, select { width: 100%; padding: 10px 14px; background: #334155; border: 1px solid #475569; border-radius: 8px; color: #e2e8f0; font-size: 14px; }    input:focus, textarea:focus { outline: none; border-color: #60a5fa; }    button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.2s; }    button:hover { background: #2563eb; }    button.secondary { background: #475569; }    button.danger { background: #ef4444; }    .hidden { display: none !important; }    .error { color: #ef4444; font-size: 13px; margin-top: 8px; }    .success { color: #22c55e; font-size: 13px; margin-top: 8px; }    table { width: 100%; border-collapse: collapse; margin-top: 16px; }    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }    th { color: #94a3b8; font-weight: 500; }    .actions { display: flex; gap: 8px; }    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; }    .modal-content { background: #1e293b; padding: 24px; border-radius: 12px; width: 90%; max-width: 600px; }    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; background: #334155; }    .badge.success { background: #065f46; color: #34d399; }  </style>  <div class=container id=loginPage>    <div class=login-box>      <h1>🔐 KV 数据管理</h1>      <div id=step1>        <div class=form-group>          <label>用户名</label>          <input type=text id=username placeholder=输入用户名 value=admin>        </div>        <div class=form-group>          <label>密码</label>          <input type=password id=password placeholder=输入密码>        </div>        <button onclick=loginStep1()>下一步</button>        <div id=step1Error class=error></div>      </div>      <div id=step2 class=hidden>        <p style=margin-bottom:16px;color:#94a3b8>请输入 Google Authenticator 中的 6 位验证码</p>        <div class=form-group>          <label>TOTP 验证码</label>          <input type=text id=totpCode placeholder=000000 maxlength=6 inputmode=numeric>        </div>        <button onclick=loginStep2()>验证并登录</button>        <button class=secondary onclick=backToStep1()>返回</button>        <div id=step2Error class=error></div>      </div>    </div>  </div>  <div id=dashboard class=hidden>    <div class=container>      <div class=panel>        <div class=header>          <h2>📦 KV 数据管理</h2>          <div>            <span class=badge id=userBadge>admin</span>            <button class=secondary onclick=logout()>退出</button>          </div>        </div>        <div style=display:flex;gap:12px;margin-bottom:20px>          <input type=text id=searchPrefix placeholder=键前缀过滤... style=flex:1>          <button onclick=loadKeys()>刷新</button>          <button onclick=showAddModal()>+ 新增</button>        </div>        <table>          <thead>            <tr>              <th>键 (Key)</th>              <th>值预览</th>              <th>操作</th>            </tr>          </thead>          <tbody id=kvTable></tbody>        </table>      </div>    </div>  </div>  <div id=editModal class=modal hidden>    <div class=modal-content>      <h3 id=modalTitle>编辑数据</h3>      <div class=form-group>        <label>键 (Key)</label>        <input type=text id=editKey readonly>      </div>      <div class=form-group>        <label>值 (Value)</label>        <textarea id=editValue rows=6 placeholder=输入 JSON 或文本...></textarea>      </div>      <div style=display:flex;gap:12px;justify-content:flex-end>        <button class=secondary onclick=closeModal()>取消</button>        <button onclick=saveData()>保存</button>      </div>    </div>  </div>  <script>    const API_BASE = '';    let authToken = localStorage.getItem('kv_auth_token');    let tempCredentials = {};    if (authToken) verifyToken();    async function loginStep1() {      const username = document.getElementById('username').value;      const password = document.getElementById('password').value;      try {        const res = await fetch(`${API_BASE}/api/auth/login`, {          method: 'POST',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ username, password })        });        const data = await res.json();        if (data.requireTOTP) {          tempCredentials = { username, password };          document.getElementById('step1').classList.add('hidden');          document.getElementById('step2').classList.remove('hidden');        } else if (data.token) {          authToken = data.token;          localStorage.setItem('kv_auth_token', authToken);          showDashboard();        } else {          document.getElementById('step1Error').textContent = data.message;        }      } catch (err) {        document.getElementById('step1Error').textContent = '登录失败：' + err.message;      }    }    async function loginStep2() {      const totpCode = document.getElementById('totpCode').value;      try {        const res = await fetch(`${API_BASE}/api/auth/verify-totp`, {          method: 'POST',          headers: { 'Content-Type': 'application/json' },          body: JSON.stringify({ ...tempCredentials, totpCode })        });        const data = await res.json();        if (data.token) {          authToken = data.token;          localStorage.setItem('kv_auth_token', authToken);          showDashboard();        } else {          document.getElementById('step2Error').textContent = data.message;        }      } catch (err) {        document.getElementById('step2Error').textContent = '验证失败：' + err.message;      }    }    function backToStep1() {      document.getElementById('step2').classList.add('hidden');      document.getElementById('step1').classList.remove('hidden');      document.getElementById('totpCode').value = '';    }    async function verifyToken() {      try {        const res = await fetch(`${API_BASE}/api/auth/verify`, {          headers: { 'Authorization': `Bearer ${authToken}` }        });        if (res.ok) {          showDashboard();        } else {          localStorage.removeItem('kv_auth_token');          authToken = null;        }      } catch (err) {        localStorage.removeItem('kv_auth_token');        authToken = null;      }    }    function showDashboard() {      document.getElementById('loginPage').classList.add('hidden');      document.getElementById('dashboard').classList.remove('hidden');      loadKeys();    }    async function loadKeys() {      const prefix = document.getElementById('searchPrefix').value;      try {        const res = await fetch(`${API_BASE}/api/kv?prefix=${encodeURIComponent(prefix)}`, {          headers: { 'Authorization': `Bearer ${authToken}` }        });        const data = await res.json();        const tbody = document.getElementById('kvTable');        tbody.innerHTML = '';        if (data.data && data.data.length > 0) {          data.data.forEach(item => {            const tr = document.createElement('tr');            tr.innerHTML = `<td>${escapeHtml(item.name)}</td><td><code>${escapeHtml(String(item.value || '').substring(0, 100))}</code></td><td class=actions><button onclick=editKey('${escapeHtml(item.name)}')>编辑</button><button class=danger onclick=deleteKey('${escapeHtml(item.name)}')>删除</button></td>`;            tbody.appendChild(tr);          });        } else {          tbody.innerHTML = '<tr><td colspan=3 style=text-align:center;color:#64748b>暂无数据</td></tr>';        }      } catch (err) {        alert('加载失败：' + err.message);      }    }    async function editKey(key) {      try {        const res = await fetch(`${API_BASE}/api/kv/${encodeURIComponent(key)}`, {          headers: { 'Authorization': `Bearer ${authToken}` }        });        const data = await res.json();        document.getElementById('modalTitle').textContent = '编辑数据';        document.getElementById('editKey').value = key;        document.getElementById('editValue').value = typeof data.value === 'object' ? JSON.stringify(data.value, null, 2) : data.value;        document.getElementById('editModal').classList.remove('hidden');      } catch (err) {        alert('获取失败：' + err.message);      }    }    function showAddModal() {      document.getElementById('modalTitle').textContent = '新增数据';      document.getElementById('editKey').value = '';      document.getElementById('editKey').readOnly = false;      document.getElementById('editValue').value = '';      document.getElementById('editModal').classList.remove('hidden');    }    async function saveData() {      const key = document.getElementById('editKey').value;      const value = document.getElementById('editValue').value;      try {        const res = await fetch(`${API_BASE}/api/kv/${encodeURIComponent(key)}`, {          method: 'PUT',          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },          body: JSON.stringify({ value })        });        if (res.ok) {          closeModal();          loadKeys();        } else {          alert('保存失败');        }      } catch (err) {        alert('保存失败：' + err.message);      }    }    async function deleteKey(key) {      if (!confirm(`确定删除键 ${key} 吗？`)) return;      try {        const res = await fetch(`${API_BASE}/api/kv/${encodeURIComponent(key)}`, {          method: 'DELETE',          headers: { 'Authorization': `Bearer ${authToken}` }        });        if (res.ok) {          loadKeys();        } else {          alert('删除失败');        }      } catch (err) {        alert('删除失败：' + err.message);      }    }    function closeModal() {      document.getElementById('editModal').classList.add('hidden');    }    function logout() {      localStorage.removeItem('kv_auth_token');      authToken = null;      document.getElementById('dashboard').classList.add('hidden');      document.getElementById('loginPage').classList.remove('hidden');      document.getElementById('step2').classList.add('hidden');      document.getElementById('step1').classList.remove('hidden');    }    function escapeHtml(text) {      const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }    document.getElementById('editModal').addEventListener('click', e => { if (e.target === document.getElementById('editModal')) closeModal(); });  </script>
