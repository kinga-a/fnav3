<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 短链接服务</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="container admin">
    <header class="admin-header">
      <h1>📊 短链接管理后台</h1>
      <div class="header-actions">
        <span id="userInfo"></span>
        <button onclick="logout()" class="btn-secondary">退出</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('links')">🔗 链接管理</button>
      <button class="tab-btn" onclick="switchTab('stats')">📈 数据统计</button>
    </nav>

    <div id="linksTab" class="tab-content active">
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="搜索短码或URL..." oninput="filterLinks()">
        <span id="linkCount" class="count-badge">0 条链接</span>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>短码</th>
              <th>目标URL</th>
              <th>创建时间</th>
              <th>点击数</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="linksTable"></tbody>
        </table>
      </div>
    </div>

    <div id="statsTab" class="tab-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalLinks">0</div>
          <div class="stat-label">总链接数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalClicks">0</div>
          <div class="stat-label">总点击量</div>
        </div>
      </div>
      <div class="chart-container" id="statsChart"></div>
    </div>
  </div>

  <div id="editModal" class="modal hidden">
    <div class="modal-content">
      <h3>编辑短链</h3>
      <input type="hidden" id="editCode">
      <div class="input-group">
        <label>目标URL</label>
        <input type="url" id="editUrl">
      </div>
      <div class="input-group">
        <label>访问密码（留空取消）</label>
        <input type="text" id="editPassword">
      </div>
      <div class="input-group">
        <label>过期天数（0=永久）</label>
        <input type="number" id="editExpire" min="0">
      </div>
      <div class="modal-actions">
        <button onclick="saveEdit()" class="btn-primary">保存</button>
        <button onclick="closeModal()" class="btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('admin_token');
    if (!token) window.location.href = '/login.html';

    let allLinks = [];

    async function checkAuth() {
      const res = await fetch('/api/verify', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (!data.valid) {
        logout();
        return;
      }
      document.getElementById('userInfo').textContent = '👤 ' + data.user.sub;
    }

    async function loadLinks() {
      const res = await fetch('/api/links', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success) {
        allLinks = data.links;
        renderLinks(allLinks);
      }
    }

    function renderLinks(links) {
      const tbody = document.getElementById('linksTable');
      const domain = window.location.host;

      tbody.innerHTML = links.map(link => {
        const date = new Date(link.createdAt).toLocaleString('zh-CN');
        const status = link.active !== false ? 
          '<span class="badge active">启用</span>' : 
          '<span class="badge inactive">禁用</span>';
        const expired = link.expireAt && Date.now() > link.expireAt;
        const expireBadge = expired ? '<span class="badge expired">已过期</span>' : '';
        const pwdBadge = link.password ? '🔒' : '';

        return '<tr>' +
          '<td><a href="https://' + domain + '/s/' + link.shortCode + '" target="_blank">/s/' + link.shortCode + '</a> ' + pwdBadge + '</td>' +
          '<td class="url-cell" title="' + link.url + '">' + link.url + '</td>' +
          '<td>' + date + '</td>' +
          '<td>' + (link.clicks || 0) + '</td>' +
          '<td>' + status + ' ' + expireBadge + '</td>' +
          '<td>' +
            '<button onclick="toggleLink(\'' + link.shortCode + '\', ' + (link.active !== false) + ')" class="btn-small">' + (link.active !== false ? '禁用' : '启用') + '</button>' +
            '<button onclick="editLink(\'' + link.shortCode + '\')" class="btn-small">编辑</button>' +
            '<button onclick="deleteLink(\'' + link.shortCode + '\')" class="btn-small danger">删除</button>' +
          '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('linkCount').textContent = links.length + ' 条链接';
    }

    function filterLinks() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allLinks.filter(l => 
        l.shortCode.toLowerCase().includes(query) || 
        l.url.toLowerCase().includes(query)
      );
      renderLinks(filtered);
    }

    async function toggleLink(code, currentActive) {
      await fetch('/api/links/' + code, {
        method: 'PUT',
        headers: { 
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ active: !currentActive })
      });
      loadLinks();
    }

    function editLink(code) {
      const link = allLinks.find(l => l.shortCode === code);
      if (!link) return;
      document.getElementById('editCode').value = code;
      document.getElementById('editUrl').value = link.url;
      document.getElementById('editPassword').value = link.password || '';
      document.getElementById('editExpire').value = link.expireAt ? 
        Math.ceil((link.expireAt - Date.now()) / 86400000) : 0;
      document.getElementById('editModal').classList.remove('hidden');
    }

    async function saveEdit() {
      const code = document.getElementById('editCode').value;
      const url = document.getElementById('editUrl').value;
      const password = document.getElementById('editPassword').value;
      const expireDays = parseInt(document.getElementById('editExpire').value) || 0;

      await fetch('/api/links/' + code, {
        method: 'PUT',
        headers: { 
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ url, password: password || undefined, expireDays })
      });
      closeModal();
      loadLinks();
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function deleteLink(code) {
      if (!confirm('确定删除短链 /s/' + code + ' 吗？此操作不可恢复。')) return;
      await fetch('/api/links/' + code, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadLinks();
    }

    async function loadStats() {
      const res = await fetch('/api/stats', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('totalLinks').textContent = data.totalLinks;
        document.getElementById('totalClicks').textContent = data.totalClicks;

        const chart = document.getElementById('statsChart');
        const maxClicks = Math.max(...data.stats.map(s => s.clicks), 1);
        chart.innerHTML = data.stats.slice(0, 20).map(s => 
          '<div class="bar-row">' +
            '<span class="bar-label" title="' + s.url + '">/s/' + s.shortCode + '</span>' +
            '<div class="bar-wrap"><div class="bar" style="width: ' + (s.clicks / maxClicks * 100) + '%"></div></div>' +
            '<span class="bar-value">' + s.clicks + '</span>' +
          '</div>'
        ).join('');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Tab').classList.add('active');
      if (tab === 'stats') loadStats();
    }

    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = '/login.html';
    }

    checkAuth();
    loadLinks();
  </script>
</body>
</html>
