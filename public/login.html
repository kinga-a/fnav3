<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="container narrow">
    <div class="card login-card">
      <h2>🔐 管理员登录</h2>
      <p class="subtitle">账号 + 密码 + TOTP 双因素认证</p>

      <div class="input-group">
        <label>账号</label>
        <input type="text" id="username" placeholder="管理员账号" autocomplete="username">
      </div>

      <div class="input-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
      </div>

      <div class="input-group">
        <label>TOTP 验证码</label>
        <input type="text" id="totpCode" placeholder="6位数字验证码" maxlength="6" inputmode="numeric">
        <small>请使用 Authenticator 应用生成验证码</small>
      </div>

      <button id="loginBtn" class="btn-primary full">登录</button>
      <p id="errorMsg" class="error hidden"></p>
    </div>
  </div>

  <script>
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const totpCode = document.getElementById('totpCode').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (!username || !password || !totpCode) {
        errorMsg.textContent = '请填写所有字段';
        errorMsg.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, totpCode }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin.html';
        } else {
          errorMsg.textContent = data.error || '登录失败';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = '网络错误';
        errorMsg.classList.remove('hidden');
      }
    });

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });
    });
  </script>
</body>
</html>
