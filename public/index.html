<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短链接生成服务</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔗 短链接生成服务</h1>
      <p>快速生成简洁、易分享的短链接</p>
    </header>

    <main>
      <div class="card generate-card">
        <div class="input-group">
          <input type="url" id="targetUrl" placeholder="粘贴长链接，例如 https://example.com/very/long/url..." required>
        </div>
        
        <div class="options">
          <div class="option-row">
            <label>自定义短码（可选）</label>
            <input type="text" id="customCode" placeholder="如: mylink" maxlength="32">
          </div>
          <div class="option-row">
            <label>过期时间（天，0=永久）</label>
            <input type="number" id="expireDays" placeholder="0" min="0" value="0">
          </div>
          <div class="option-row">
            <label>访问密码（可选）</label>
            <input type="text" id="password" placeholder="留空则公开访问">
          </div>
        </div>

        <button id="generateBtn" class="btn-primary">
          <span>✨ 生成短链接</span>
        </button>

        <div id="result" class="result hidden">
          <div class="result-box">
            <div class="short-url" id="shortUrl"></div>
            <div class="actions">
              <button class="btn-copy" onclick="copyUrl()">📋 复制</button>
              <button class="btn-qr" onclick="showQR()">📱 二维码</button>
            </div>
          </div>
          <div id="qrCode" class="qr-code hidden"></div>
        </div>
      </div>

      <div class="features">
        <div class="feature">
          <span>⚡</span>
          <h3>极速跳转</h3>
          <p>全球边缘节点，毫秒级响应</p>
        </div>
        <div class="feature">
          <span>🔒</span>
          <h3>密码保护</h3>
          <p>支持设置访问密码</p>
        </div>
        <div class="feature">
          <span>📊</span>
          <h3>点击统计</h3>
          <p>后台实时查看访问数据</p>
        </div>
      </div>
    </main>

    <footer>
      <a href="/admin.html" class="admin-link">👤 管理后台</a>
    </footer>
  </div>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const resultDiv = document.getElementById('result');
    const shortUrlDiv = document.getElementById('shortUrl');
    const qrCodeDiv = document.getElementById('qrCode');

    generateBtn.addEventListener('click', async () => {
      const url = document.getElementById('targetUrl').value.trim();
      const customCode = document.getElementById('customCode').value.trim();
      const expireDays = parseInt(document.getElementById('expireDays').value) || 0;
      const password = document.getElementById('password').value.trim();

      if (!url) {
        alert('请输入有效的 URL');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span>⏳ 生成中...</span>';

      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, customCode: customCode || undefined, expireDays, password: password || undefined }),
        });
        const data = await res.json();

        if (data.success) {
          shortUrlDiv.textContent = data.shortUrl;
          resultDiv.classList.remove('hidden');
          qrCodeDiv.classList.add('hidden');
        } else {
          alert(data.error || '生成失败');
        }
      } catch (err) {
        alert('网络错误，请重试');
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = '<span>✨ 生成短链接</span>';
      }
    });

    function copyUrl() {
      const url = shortUrlDiv.textContent;
      navigator.clipboard.writeText(url).then(() => {
        alert('已复制到剪贴板！');
      });
    }

    function showQR() {
      const url = encodeURIComponent(shortUrlDiv.textContent);
      qrCodeDiv.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${url}" alt="QR Code">`;
      qrCodeDiv.classList.toggle('hidden');
    }
  </script>
</body>
</html>
